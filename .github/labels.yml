# Single source of truth for repository labels (synced by .github/workflows/labels.yml).
# Format: crazy-max/ghaction-github-labeler.

# --- Type ---
- name: bug
  color: d73a4a
  description: Something isn't working
- name: enhancement
  color: a2eeef
  description: New feature or request
- name: documentation
  color: 0075ca
  description: Documentation only changes
- name: question
  color: d876e3
  description: Further information is requested

# --- Area ---
- name: core-engine
  color: 5319e7
  description: "Protected: deterministic simulation core (math, RNG, templates)"
- name: ai-layer
  color: fbca04
  description: Optional AI / OpenAI integration
- name: cli
  color: 1d76db
  description: CLI, commands, and output formatting
- name: storage
  color: c2e0c6
  description: Local config storage (~/.mse/config.json)
- name: security
  color: b60205
  description: Security-sensitive; requires security review
- name: ci
  color: ededed
  description: CI/CD, workflows, and tooling
- name: dependencies
  color: 0366d6
  description: Dependency updates

# --- Status ---
- name: triage
  color: ffffff
  description: Needs triage / not yet reviewed by a maintainer
- name: needs-info
  color: fef2c0
  description: Awaiting more information from the reporter
- name: in-progress
  color: 0e8a16
  description: Actively being worked on
- name: blocked
  color: e11d21
  description: Blocked by another issue or external factor
- name: wontfix
  color: ffffff
  description: This will not be worked on

# --- Priority ---
- name: 'priority: p0'
  color: b60205
  description: Critical — drop everything
- name: 'priority: p1'
  color: d93f0b
  description: High priority
- name: 'priority: p2'
  color: fbca04
  description: Normal priority

# --- Special ---
- name: breaking-change
  color: d73a4a
  description: Introduces a backwards-incompatible change
- name: determinism
  color: 5319e7
  description: Affects deterministic / reproducible behavior
- name: good-first-issue
  color: 7057ff
  description: Good for newcomers
- name: help-wanted
  color: 008672
  description: Extra attention is wanted
